// ============================================================
// レート制限管理（ITPM枠を自前で監視）
// ============================================================

class RateLimiter {
  constructor(limit, windowMs) {
    this.limit = limit;       // ITPM上限
    this.windowMs = windowMs; // ウィンドウ（60秒）
    this.history = [];        // {timestamp, tokens}
  }
  cleanup() {
    const cutoff = Date.now() - this.windowMs;
    this.history = this.history.filter(h => h.timestamp > cutoff);
  }
  currentUsage() {
    this.cleanup();
    return this.history.reduce((sum, h) => sum + h.tokens, 0);
  }
  async waitForBudget(estimated, onWait) {
    while (true) {
      this.cleanup();
      const current = this.currentUsage();
      if (current + estimated <= this.limit) return;
      const oldest = this.history[0];
      if (!oldest) return;
      const waitMs = Math.max((oldest.timestamp + this.windowMs) - Date.now() + 500, 1000);
      onWait?.(current, this.limit, waitMs);
      await new Promise(r => setTimeout(r, waitMs));
    }
  }
  record(tokens) {
    this.history.push({ timestamp: Date.now(), tokens });
  }
}

function extractJSON(text) {
  const cleaned = text.replace(/```json\s*|\s*```/g, "").trim();
  // 全ての { を起点に、波括弧カウント方式でJSONを探す
  // 末尾近くのものから順に試す（LLMは前置き→JSONの順で返すことが多いため）
  const candidates = [];
  for (let start = 0; start < cleaned.length; start++) {
    if (cleaned[start] !== "{") continue;
    let depth = 0, inString = false, escape = false;
    for (let i = start; i < cleaned.length; i++) {
      const ch = cleaned[i];
      if (escape) { escape = false; continue; }
      if (inString) {
        if (ch === "\\") { escape = true; continue; }
        if (ch === '"') { inString = false; continue; }
        continue;
      }
      if (ch === '"') { inString = true; continue; }
      if (ch === "{") depth++;
      else if (ch === "}") {
        depth--;
        if (depth === 0) {
          candidates.push(cleaned.slice(start, i + 1));
          break;
        }
      }
    }
  }
  // 大きいJSON（通常は中身のあるもの）から試す
  candidates.sort((a, b) => b.length - a.length);
  for (const c of candidates) {
    try { return JSON.parse(c); } catch (e) {}
  }
  return null;
}

async function callClaudeForJSON({ section, userVars, useWebSearch = false, maxTokens = 2048 }) {
  const apiKey = getApiKey();
  if (!apiKey) return { error: "APIキーが設定されていません（右上「設定」から登録）" };

  const userPrompt = `セクション: ${section}\n${userVars || ""}`.trim();

  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: maxTokens,
    system: [{
      type: "text",
      text: SYSTEM_PROMPT,
      cache_control: { type: "ephemeral" }
    }],
    messages: [{ role: "user", content: userPrompt }],
  };
  if (useWebSearch) {
    body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  }

  const headers = {
    "Content-Type": "application/json",
    "x-api-key": apiKey,
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };

  async function doFetch() {
    return await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body) });
  }

  // システムプロンプト + ユーザープロンプトの推定トークン数（日本語は約3文字/トークン）
  const estimatedInput = Math.ceil((SYSTEM_PROMPT.length + userPrompt.length) / 3);
  await inputLimiter.waitForBudget(estimatedInput, (current, limit, waitMs) => {
    onRateLimitWait?.(`ITPM枠待機中 (${current}/${limit}トークン使用中、約${Math.ceil(waitMs/1000)}秒待つ)`);
  });

  let resp;
  try { resp = await doFetch(); }
  catch (e) { return { error: `通信エラー: ${e.message}` }; }

  if (!resp.ok) {
    const errText = await resp.text().catch(() => "");
    if (resp.status === 429) {
      let lastErrText = errText;
      for (let attempt = 0; attempt < 3; attempt++) {
        const retryAfter = resp.headers.get("retry-after");
        const waitMs = retryAfter ? Math.min(parseFloat(retryAfter) * 1000, 90000) : 60000;
        onRateLimitWait?.(`429受信、${Math.ceil(waitMs/1000)}秒待機して再試行`);
        await new Promise(r => setTimeout(r, waitMs + 1000));
        try {
          resp = await doFetch();
          if (resp.ok) break;
          lastErrText = await resp.text().catch(() => "");
          if (resp.status !== 429) {
            return { error: `HTTP ${resp.status}: ${lastErrText.slice(0, 200)}` };
          }
        } catch (e) { return { error: `リトライ時の通信エラー: ${e.message}` }; }
      }
      if (!resp.ok) return { error: `429リトライ3回失敗。詳細: ${lastErrText.slice(0, 200)}` };
    } else {
      return { error: `HTTP ${resp.status}: ${errText.slice(0, 200)}` };
    }
  }

  let data;
  try { data = await resp.json(); }
  catch (e) { return { error: `JSON解析失敗: ${e.message}` }; }

  // 実際に使ったトークン数をrate limiterに記録
  // sonnet-4-6では cache_read は ITPM にカウントされない（公式ドキュメント確認済み）
  const usage = data.usage || {};
  const cacheCreate = usage.cache_creation_input_tokens || 0;
  const cacheRead = usage.cache_read_input_tokens || 0;
  const regularInput = usage.input_tokens || 0;
  const itpmCounted = cacheCreate + regularInput; // cacheReadは除外
  const totalInput = cacheCreate + cacheRead + regularInput;
  inputLimiter.record(itpmCounted);
  if (cacheCreate > 0 || cacheRead > 0) {
    onRateLimitWait?.(`使用: 通常${regularInput}+キャッシュ作成${cacheCreate}+読込${cacheRead}=合計${totalInput}（ITPM計上${itpmCounted}）`);
  }

  const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text);
  if (textBlocks.length === 0) return { error: "レスポンスにテキストブロックがありません" };

  for (const text of [...textBlocks].reverse()) {
    const parsed = extractJSON(text);
    if (parsed) return { data: parsed };
  }
  return { error: `JSONが見つからない。先頭: ${textBlocks[0].slice(0, 100)}` };
}

==========================================
共通ルール
==========================================
- basisが"fact"の場合は嘘を書かない。確信が持てない場合は basis を "hypothesis" にする
- sourcesには信頼できる実在URLのみ。ない場合は空配列 []
- modifier指示（「もっとブランディング担当者向けに」「もっと簡単に」など）が user 側にある場合は、JSONの**構造（スキーマ）は絶対に変えず**、各テキストフィールドの**表現だけ**を変える。フィールドを増やしたり減らしたり、配列を空にしたりしない
- 全てのテキストは日本語

==========================================
強調記法（重要）
==========================================
全てのテキストフィールドで、以下を **太字** マークで強調する：
- 数値（CO2削減率**30%**、強度**50N/mm²**、コスト**¥500億**、**5,000棟**など）
- 年号・期間（**2027年**、**2030年代前半**、**直近3年**など）
- 規制・基準・法令名（**SBT**、**TCFD**、**改正建築物省エネ法**、**Scope3**など）
- 固有名詞（社名、技術商標名、プロジェクト名など）
- 重要なキーワード（差別化ポイントの核心1つだけ）

ただし強調は**文章の20%以下**に抑える（多用すると逆効果）。普通の文体の中に、視線を引く太字が散りばめられている状態が理想。

==========================================
重要：技術名が誤っているまたは確認できない場合
==========================================
入力された技術名が竹中工務店の正式技術名でない、または存在を確認できない場合でも、
必ずJSONを返す。前置き・解説文を返してはいけない。以下のいずれかで対応：

(1) 似た正式技術名が分かる場合：その正式名称で nameフィールドを置き換えて、
    通常通り該当セクションのデータを返す。definition.text の冒頭で「正式名称は○○です」と注記。
    例：入力「エコクリート」→ name: "ECMコンクリート®", definition.text: "正式名称はECMコンクリート®。..."

(2) どうしても該当が分からない場合：以下のJSONで返す（セクション問わず共通）
    { "error": "unknown_technology", "input": "入力された名前", "suggestion": "近そうな正式名称があれば1つだけ" }`;

function normalizeTermName(name) {
  return (name || "").toLowerCase().replace(/[\s®™©・\-\u30fb（）()]/g, "").trim();
}

function isAlreadyAdded(candidateName, existingTerms) {
  const norm = normalizeTermName(candidateName);
  if (!norm) return false;
  return existingTerms.some(t => {
    const ex = normalizeTermName(t.name);
    if (!ex) return false;
    return ex === norm || ex.includes(norm) || norm.includes(ex);
  });
}

async function generateSeedList(existingTerms, useWebSearch) {
  const existingNames = existingTerms.map(t => t.name).filter(Boolean);
  const userVars = existingNames.length > 0
    ? `除外: ${existingNames.join(", ")}\n上記以外で15個リストアップしてください。重複禁止。`
    : "15個リストアップしてください。";
  const r = await callClaudeForJSON({
    section: "seedlist",
    userVars,
    useWebSearch,
    maxTokens: 800,
  });
  if (r.error) return { error: r.error };
  const names = r.data?.names || [];
  const filtered = names.filter(n => n && !isAlreadyAdded(n, existingTerms));
  return { names: filtered };
}

async function generateFullTerm(termName, useWebSearch, onProgress) {
  const userVars = `技術名: ${termName}`;
  const sections = [
    { key: "text", section: "text", label: "①知る（テキスト）", maxTokens: 800 },
    { key: "diagram", section: "diagram", label: "①知る（図解）", maxTokens: 2500 },
    { key: "compare", section: "compare", label: "②比べる", maxTokens: 2500 },
    { key: "valuePitch", section: "valuePitch", label: "③価値・⑤訴求", maxTokens: 800 },
    { key: "future", section: "future", label: "④未来", maxTokens: 2200 },
  ];

  const results = [];
  for (let i = 0; i < sections.length; i++) {
    const s = sections[i];
    if (i > 0) await new Promise(r => setTimeout(r, 3000));
    onProgress?.({ section: s.label, status: "running" });
    const r = await callClaudeForJSON({ section: s.section, userVars, useWebSearch, maxTokens: s.maxTokens });
    onProgress?.({ section: s.label, status: r.error ? "error" : "done", error: r.error });
    results.push({ key: s.key, ...r });
  }

  const text = results.find(r => r.key === "text")?.data;
  if (!text) {
    const textErr = results.find(r => r.key === "text")?.error;
    return { error: `①知るのテキスト取得に失敗: ${textErr || "不明"}` };
  }
  const diagram = results.find(r => r.key === "diagram")?.data;
  const compare = results.find(r => r.key === "compare")?.data;
  const valuePitch = results.find(r => r.key === "valuePitch")?.data;
  const future = results.find(r => r.key === "future")?.data;

  return {
    term: {
      id: `term_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      name: text.name || termName,
      reading: text.reading || "",
      category: text.category || "その他",
      tags: [],
      mastery: 0,
      know: { definition: text.definition, analogy: text.analogy, diagramSVG: diagram?.diagramSVG || "" },
      compare: compare?.compare || [],
      value: valuePitch?.value || null,
      pitch: valuePitch?.pitch || [],
      future: future?.future || [],
      myMemo: "",
      createdAt: Date.now(),
      updatedAt: Date.now(),
    },
  };
}

const MODIFIER_PROMPTS = {

};

async function regenerateSection(termName, section, modifier, useWebSearch) {
  const userVars = `技術名: ${termName}\n指示: ${MODIFIER_PROMPTS[modifier]}`;
  const tokensMap = { text: 800, diagram: 2500, compare: 2500, valuePitch: 800, future: 2200 };
  return await callClaudeForJSON({ section, userVars, useWebSearch, maxTokens: tokensMap[section] });
}

function FormatText({ text, className = "" }) {
  if (!text) return null;
  // **太字** マークを <strong> に変換
  const parts = String(text).split(/(\*\*[^*]+\*\*)/g);
  return (
    <span className={className}>
      {parts.map((p, i) => {
        if (p.startsWith("**") && p.endsWith("**") && p.length > 4) {
          return <strong key={i} className="font-bold text-stone-900 bg-yellow-100/60 px-0.5 rounded">{p.slice(2, -2)}</strong>;
        }
        return <React.Fragment key={i}>{p}</React.Fragment>;
      })}
    </span>
  );
}

function BasisBadge({ basis, sources = [] }) {
  if (basis === "fact") {
    return <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs bg-emerald-50 text-emerald-800 border border-emerald-300 rounded">✓ 出典あり {sources?.length > 0 && `(${sources.length})`}</span>;
  }
  return <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs bg-amber-50 text-amber-800 border border-amber-300 rounded">💭 推論</span>;
}

function CategoryBadge({ category }) {
  const cls = CATEGORY_STYLES[category] || CATEGORY_STYLES["その他"];
  return <span className={`inline-block px-2 py-0.5 text-xs border rounded ${cls}`}>{category}</span>;
}

function TagChip({ tag, onRemove }) {
  return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 text-xs bg-stone-200 text-stone-800 rounded-full">
      #{tag}
      {onRemove && <button onClick={onRemove} className="text-stone-500 hover:text-stone-900 ml-1">×</button>}
    </span>
  );
}

function TagInput({ tags, onChange, allTags }) {
  const [input, setInput] = useState("");
  const suggestions = input.trim() ? allTags.filter(t => t.includes(input) && !tags.includes(t)).slice(0, 5) : [];
  function addTag(tag) {
    const trimmed = tag.trim();
    if (trimmed && !tags.includes(trimmed)) onChange([...tags, trimmed]);
    setInput("");
  }
  return (
    <div>
      <div className="flex flex-wrap gap-1 mb-2">
        {tags.map(t => <TagChip key={t} tag={t} onRemove={() => onChange(tags.filter(x => x !== t))} />)}
      </div>
      <div className="relative">
        <input value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addTag(input); } }}
          placeholder="タグを入力してEnter（例：竹中固有 / プレゼン候補 / 未理解）"
          className="w-full px-3 py-1.5 text-sm border border-stone-300 rounded focus:outline-none focus:border-stone-500" />
        {suggestions.length > 0 && (
          <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-stone-300 rounded shadow-sm z-10">
            {suggestions.map(s => (
              <button key={s} onClick={() => addTag(s)} className="block w-full text-left px-3 py-1.5 text-sm hover:bg-stone-50">#{s}</button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function SourceLinks({ sources }) {
  if (!sources || sources.length === 0) return null;
  return (
    <div className="mt-2 flex flex-wrap gap-2">
      {sources.map((url, i) => (
        <a key={i} href={url} target="_blank" rel="noopener noreferrer"
          className="text-xs text-emerald-700 hover:text-emerald-900 underline truncate max-w-xs">
          {(() => { try { return new URL(url).hostname; } catch { return url; } })()}
        </a>
      ))}
    </div>
  );
}

function PortfolioView({ terms, onSelect, onAddNew, onSeed, onUpdateOrder, onDelete }) {
  const [search, setSearch] = useState("");
  const [activeTags, setActiveTags] = useState([]);
  const [masteryFilter, setMasteryFilter] = useState("all");
  const [draggedTermId, setDraggedTermId] = useState(null);
  const [dragOverTermId, setDragOverTermId] = useState(null);

  const allTags = useMemo(() => {
    const set = new Set();
    terms.forEach(t => (t.tags || []).forEach(tag => set.add(tag)));
    return [...set].sort();
  }, [terms]);

  const filtered = useMemo(() => {
    return terms.filter(t => {
      if (search.trim()) {
        const q = search.toLowerCase();
        const hay = `${t.name} ${t.reading} ${t.category} ${(t.tags || []).join(" ")}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (activeTags.length > 0) {
        const ts = t.tags || [];
        if (!activeTags.some(tag => ts.includes(tag))) return false;
      }
      const m = t.mastery || 0;
      if (masteryFilter === "unstarted" && m !== 0) return false;
      if (masteryFilter === "low" && (m < 1 || m > 2)) return false;
      if (masteryFilter === "mid" && (m < 3 || m > 4)) return false;
      if (masteryFilter === "high" && m !== 5) return false;
      return true;
    });
  }, [terms, search, activeTags, masteryFilter]);

  function handleDragStart(e, termId) {
    setDraggedTermId(termId);
    e.dataTransfer.effectAllowed = "move";
  }
  function handleDragOver(e, termId) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (draggedTermId && draggedTermId !== termId) setDragOverTermId(termId);
  }
  function handleDragLeave() { setDragOverTermId(null); }
  function handleDrop(e, targetTermId) {
    e.preventDefault();
    if (!draggedTermId || draggedTermId === targetTermId) {
      setDraggedTermId(null); setDragOverTermId(null); return;
    }
    const draggedIdx = terms.findIndex(t => t.id === draggedTermId);
    const targetIdx = terms.findIndex(t => t.id === targetTermId);
    if (draggedIdx === -1 || targetIdx === -1) return;
    const reordered = [...terms];
    const [moved] = reordered.splice(draggedIdx, 1);
    const insertIdx = targetIdx > draggedIdx ? targetIdx - 1 : targetIdx;
    reordered.splice(insertIdx, 0, moved);
    onUpdateOrder(reordered);
    setDraggedTermId(null); setDragOverTermId(null);
  }
  function handleDragEnd() { setDraggedTermId(null); setDragOverTermId(null); }

  function handleDeleteCard(e, term) {
    e.stopPropagation();
    if (confirm(`「${term.name}」を削除しますか？`)) onDelete(term.id);
  }

  return (
    <div>
      <div className="flex justify-between items-baseline mb-6">
        <div>
          <h2 className="text-3xl text-stone-900 mb-1 serif">竹中工務店 環境技術ポートフォリオ</h2>
          <p className="text-sm text-stone-500">{terms.length} 件 · 5社軸（竹中・大林・鹿島・清水・大成）で比較</p>
        </div>
        <div className="flex gap-2">
          <button onClick={onSeed} className="px-4 py-2 bg-white text-stone-700 border border-stone-300 rounded text-sm hover:bg-stone-50">推奨セットを投入</button>
          <button onClick={onAddNew} className="px-4 py-2 bg-stone-900 text-white rounded text-sm hover:bg-stone-800">+ 用語を追加</button>
        </div>
      </div>
      <div className="mb-6 space-y-3">
        <input value={search} onChange={e => setSearch(e.target.value)}
          placeholder="検索（用語名・読み・カテゴリ・タグ）"
          className="w-full px-3 py-2 text-sm border border-stone-300 rounded focus:outline-none focus:border-stone-500 bg-white" />
        <div>
          <div className="text-xs text-stone-500 mb-1">習熟度で絞り込み</div>
          <div className="flex flex-wrap gap-1">
            {[
              { key: "all", label: "すべて" },
              { key: "unstarted", label: "☆ 未学習" },
              { key: "low", label: "★〜★★ 入門" },

function DetailView({ term, allTags, useWebSearch, onBack, onUpdate, onDelete }) {
  const [activeTab, setActiveTab] = useState(1);
  const [busy, setBusy] = useState(false);
  const [history, setHistory] = useState([]); // 再生成前の状態を積むスタック
  const tabs = [{ num: 1, label: "知る" }, { num: 2, label: "比べる" }, { num: 3, label: "価値を見る" }, { num: 4, label: "未来を見る" }, { num: 5, label: "訴求する" }];

  // 別の用語に移動したら履歴をクリア
  useEffect(() => { setHistory([]); }, [term.id]);

  function handleUndo() {
    if (history.length === 0) return;
    const previous = history[history.length - 1];
    setHistory(prev => prev.slice(0, -1));
    onUpdate(previous);
  }

  async function handleRegenerate(section, modifier) {
    setBusy(true);
    try {
      const result = await regenerateSection(term.name, section, modifier, useWebSearch);
      if (result.error) { alert("生成失敗: " + result.error); return; }
      const r = result.data;
      if (r.error === "unknown_technology") {
        alert(`AIが技術名を認識できませんでした。\n\n候補: ${r.suggestion || "（提案なし）"}\n\n元のデータは保持します。`);
        return;
      }
      const updated = { ...term };
      let valid = false;
      if (section === "text") {
        if (r.definition && r.analogy) {
          updated.know = { ...updated.know, definition: r.definition, analogy: r.analogy };
          valid = true;
        }
      } else if (section === "diagram") {
        if (r.diagramSVG && typeof r.diagramSVG === "string" && r.diagramSVG.includes("<svg")) {
          updated.know = { ...updated.know, diagramSVG: r.diagramSVG };
          valid = true;
        }
      } else if (section === "compare") {
        if (Array.isArray(r.compare) && r.compare.length > 0) {
          updated.compare = r.compare;
          valid = true;
        }
      } else if (section === "valuePitch") {
        if (r.value && Array.isArray(r.pitch)) {
          updated.value = r.value;
          updated.pitch = r.pitch;
          valid = true;
        }
      } else if (section === "future") {
        if (Array.isArray(r.future) && r.future.length > 0) {
          updated.future = r.future;
          valid = true;
        }
      }
      if (!valid) {
        alert("再生成の結果が想定外の形式でした。元のデータを保持します。\nもう一度お試しください。");
        return;
      }
      // 成功時のみ履歴に積む
      setHistory(prev => [...prev, { ...term }]);
      onUpdate(updated);
    } finally { setBusy(false); }
  }

  return (
    <div>
      <div className="flex justify-between items-center mb-6">
        <button onClick={onBack} className="text-sm text-stone-600 hover:text-stone-900">← ポートフォリオ俯瞰に戻る</button>
        <div className="flex gap-4 items-center">
          {history.length > 0 && (
            <button onClick={handleUndo}
              className="text-sm text-stone-700 hover:text-stone-900 underline"
              title={`${history.length}回戻れます`}>
              ↩️ 元に戻す{history.length > 1 ? ` (${history.length})` : ""}
            </button>
          )}
          <button onClick={() => { if (confirm(`「${term.name}」を削除しますか？`)) onDelete(term.id); }}
            className="text-sm text-red-700 hover:text-red-900">削除</button>
        </div>
      </div>
      <div className="mb-6">
        <CategoryBadge category={term.category} />
        <h2 className="text-4xl text-stone-900 mt-2 mb-1 serif">{term.name}</h2>
        <p className="text-sm text-stone-500 mb-3">{term.reading}</p>
        <div className="mb-3 p-3 bg-stone-50 border border-stone-200 rounded inline-flex items-center gap-3">
          <span className="text-xs text-stone-600 font-medium">習熟度：</span>
          <MasteryStars value={term.mastery || 0} onChange={(m) => onUpdate({ ...term, mastery: m })} />
        </div>
        <div className="max-w-2xl">
          <TagInput tags={term.tags || []} onChange={(tags) => onUpdate({ ...term, tags })} allTags={allTags} />
        </div>
      </div>
      <div className="flex gap-1 mb-6 border-b border-stone-300">
        {tabs.map(t => (
          <button key={t.num} onClick={() => setActiveTab(t.num)}
            className={`px-4 py-3 text-sm border-b-2 -mb-px ${activeTab === t.num ? "border-stone-900 text-stone-900 font-medium" : "border-transparent text-stone-500 hover:text-stone-800"}`}>
            <span className="text-xs text-stone-400 mr-2">{`0${t.num}`}</span>{t.label}
          </button>
        ))}
      </div>
      <div className="bg-white p-6 border border-stone-200 rounded">
        {activeTab === 1 && <Tab1Know term={term} onRegenerate={handleRegenerate} busy={busy} />}
        {activeTab === 2 && <Tab2Compare term={term} onRegenerate={handleRegenerate} busy={busy} />}
        {activeTab === 3 && <Tab3Value term={term} onRegenerate={handleRegenerate} busy={busy} />}
        {activeTab === 4 && <Tab4Future term={term} onRegenerate={handleRegenerate} busy={busy} />}
        {activeTab === 5 && <Tab5Pitch term={term} onMemoChange={(memo) => onUpdate({ ...term, myMemo: memo })} onRegenerate={handleRegenerate} busy={busy} />}
      </div>
    </div>
  );
}

function AddView({ onCancel, onAdded, useWebSearch, setUseWebSearch }) {
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [log, setLog] = useState([]);

  function addLog(text, error = false) {
    const time = new Date().toLocaleTimeString("ja-JP");
    setLog(prev => [...prev, { time, text, error }]);
  }

  async function handleGenerate() {
    if (!name.trim()) return;
    setBusy(true); setLog([]);
    addLog(`「${name}」を生成開始（Web検索: ${useWebSearch ? "ON" : "OFF"}）`);
    onRateLimitWait = (msg) => addLog(`  ⓘ ${msg}`);
    try {
      const result = await generateFullTerm(name.trim(), useWebSearch, (p) => {
        addLog(`${p.section}: ${p.status}${p.error ? ` (${p.error})` : ""}`, p.status === "error");
      });
      if (result.error) { addLog(result.error, true); return; }
      addLog("完了！");
      setTimeout(() => onAdded(result.term), 500);
    } catch (e) { addLog("例外: " + e.message, true); }
    finally { onRateLimitWait = null; setBusy(false); }
  }

  return (
    <div>
      <button onClick={onCancel} className="mb-6 text-sm text-stone-600 hover:text-stone-900">← 戻る</button>
      <h2 className="text-3xl text-stone-900 mb-2 serif">新規用語を追加</h2>
      <p className="text-sm text-stone-500 mb-8">技術名を入力すると、AIが5タブを逐次でリサーチして仕込みます。</p>
      <div className="bg-white p-6 border border-stone-200 rounded">
        <label className="block text-sm text-stone-700 mb-2">技術名</label>
        <input type="text" value={name} onChange={(e) => setName(e.target.value)}
          placeholder="例：燃エンウッド、バイオスキン …"
          className="w-full p-3 border border-stone-300 rounded text-stone-900 focus:outline-none focus:border-stone-500 serif" disabled={busy} />
        <div className="mt-3"><WebSearchToggle value={useWebSearch} onChange={setUseWebSearch} /></div>
        <div className="mt-4 flex gap-2 items-center">
          <button onClick={handleGenerate} disabled={busy || !name.trim()}
            className="px-5 py-2 bg-stone-900 text-white rounded text-sm hover:bg-stone-800 disabled:opacity-40">
            {busy ? "生成中…" : "AIで調べる"}
          </button>
        </div>
        <ProgressLog log={log} />
      </div>
    </div>
  );
}

function SeedView({ existingTerms, onCancel, onTermAdded, useWebSearch, setUseWebSearch }) {
  // 起動時に、推奨候補の中ですでに追加済みのものを除外
  const initialList = useMemo(() => {
    return SEED_CANDIDATES_DEFAULT.filter(c => !isAlreadyAdded(c, existingTerms)).join("\n");
  }, []);
  const [list, setList] = useState(initialList);
  const [busy, setBusy] = useState(false);
  const [aiBusy, setAiBusy] = useState(false);
  const [log, setLog] = useState([]);
  const [doneCount, setDoneCount] = useState(0);
  const [totalCount, setTotalCount] = useState(0);

  function addLog(text, error = false) {
    const time = new Date().toLocaleTimeString("ja-JP");
    setLog(prev => [...prev, { time, text, error }]);
  }

  async function handleAiGenerate() {
    setAiBusy(true);
    addLog("AIに候補リストを生成依頼中…");
    try {
      const r = await generateSeedList(existingTerms, useWebSearch);
      if (r.error) { addLog("AI生成失敗: " + r.error, true); return; }
      // 既存テキストエリアの内容と重複しない技術名のみ追加
      const currentNames = list.split("\n").map(s => s.trim()).filter(Boolean);
      const newNames = r.names.filter(n => !currentNames.some(c => normalizeTermName(c) === normalizeTermName(n)));
      if (newNames.length === 0) {
        addLog("AIが新規候補を見つけられませんでした（全て既知）");
        return;
      }
      setList(prev => {
        const trimmed = prev.trim();
        return (trimmed ? trimmed + "\n" : "") + newNames.join("\n");
      });
      addLog(`AI生成: ${newNames.length}件を候補に追加 ✓`);
    } catch (e) {
      addLog("例外: " + e.message, true);
    } finally {
      setAiBusy(false);
    }
  }

  async function handleSeed() {
    const names = list.split("\n").map(s => s.trim()).filter(Boolean);
    if (names.length === 0) return;
    setBusy(true); setLog([]); setDoneCount(0); setTotalCount(names.length);
    addLog(`${names.length}件の処理開始（Web検索: ${useWebSearch ? "ON" : "OFF"}）`);
    onRateLimitWait = (msg) => addLog(`  ⓘ ${msg}`);

    for (let i = 0; i < names.length; i++) {
      const n = names[i];
      addLog(`[${i + 1}/${names.length}] ${n} 開始`);
      try {
        const result = await generateFullTerm(n, useWebSearch, (p) => {
          if (p.status === "error") addLog(`  └ ${p.section}: ${p.error}`, true);
        });
        if (result.error) {
          addLog(`  └ 失敗: ${result.error}`, true);
        } else {
          onTermAdded(result.term);
          addLog(`  └ ${n} 完了 ✓`);
        }
      } catch (e) {
        addLog(`  └ 例外: ${e.message}`, true);
      }
      setDoneCount(i + 1);
    }
    addLog("全処理完了");
    onRateLimitWait = null;
    setBusy(false);
  }

  const candidateCount = list.split("\n").map(s => s.trim()).filter(Boolean).length;

  return (
    <div>
      <button onClick={onCancel} disabled={busy} className="mb-6 text-sm text-stone-600 hover:text-stone-900 disabled:opacity-40">← 戻る</button>
      <h2 className="text-3xl text-stone-900 mb-2 serif">推奨セットを投入</h2>
      <p className="text-sm text-stone-500 mb-6">
        既に追加済みの用語は除外済み（{existingTerms.length}件 → 候補 {candidateCount}件）。
        編集してから一括リサーチ。1件ずつ完了次第ポートフォリオに追加されます。
      </p>
      <div className="bg-white p-6 border border-stone-200 rounded">
        <div className="flex justify-between items-baseline mb-2">
          <label className="block text-sm text-stone-700">技術名（1行に1つ）</label>
          <button onClick={handleAiGenerate} disabled={aiBusy || busy}
            className="text-xs px-3 py-1 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded hover:bg-emerald-100 disabled:opacity-40">
            {aiBusy ? "生成中…" : "🤖 AIで候補を追加"}
          </button>
        </div>
        <textarea value={list} onChange={e => setList(e.target.value)} disabled={busy}
          className="w-full h-48 p-3 border border-stone-300 rounded text-stone-900 text-sm focus:outline-none focus:border-stone-500 bg-white font-mono" />
        <div className="mt-3"><WebSearchToggle value={useWebSearch} onChange={setUseWebSearch} /></div>
        <div className="mt-4 flex gap-2 items-center">
          <button onClick={handleSeed} disabled={busy || !list.trim()}
            className="px-5 py-2 bg-stone-900 text-white rounded text-sm hover:bg-stone-800 disabled:opacity-40">
            {busy ? `処理中（${doneCount}/${totalCount}）…` : "リサーチ開始"}
          </button>
          {!busy && <span className="text-xs text-stone-500">Web検索OFFなら1件 25〜50秒</span>}
        </div>
        <ProgressLog log={log} />
      </div>
    </div>
  );
}

function exportJSON(terms) {
  const blob = new Blob([JSON.stringify(terms, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `brand-intel-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function App() {
  const [view, setView] = useState("portfolio");
  const [terms, setTerms] = useState(loadTerms);
  const [selectedId, setSelectedId] = useState(null);
  const [useWebSearch, setUseWebSearch] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const fileInputRef = useRef(null);

  // 初回起動でAPIキー未設定なら設定モーダルを開く
  useEffect(() => {
    if (!getApiKey()) setShowSettings(true);
  }, []);

  const selectedTerm = terms.find(t => t.id === selectedId);

  const allTags = useMemo(() => {
    const set = new Set();
    terms.forEach(t => (t.tags || []).forEach(tag => set.add(tag)));
    return [...set].sort();
  }, [terms]);

  function updateTerms(updater) {
    setTerms(prev => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveAllTerms(next);
      return next;
    });
  }

  function handleAdd(term) {
    updateTerms(prev => [...prev, term]);
    setSelectedId(term.id);
    setView("detail");
  }

  function handleTermAdded(term) {
    updateTerms(prev => [...prev, term]);
  }

  function handleUpdate(updated) {
    updateTerms(prev => prev.map(t => (t.id === updated.id ? updated : t)));
  }

  function handleDelete(termId) {
    updateTerms(prev => prev.filter(t => t.id !== termId));
    setSelectedId(null);
    setView("portfolio");
  }

  function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) { alert("JSONの形式が違います（配列が必要）"); return; }
        if (confirm(`${data.length}件の用語をインポートします。現在の${terms.length}件と統合します（同じIDは上書き）。よろしいですか？`)) {
          updateTerms(prev => {
            const map = new Map(prev.map(t => [t.id, t]));
            data.forEach(t => map.set(t.id, t));
            return [...map.values()];
          });
          alert("インポート完了");
        }
      } catch (err) { alert("ファイル読み込み失敗: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = ""; // reset
  }

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900">
      <header className="border-b border-stone-300 bg-white">
        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-baseline">
          <div>
            <div className="text-xs tracking-widest text-stone-500 uppercase">PwC × Takenaka</div>
            <h1 className="text-xl text-stone-900 serif">環境技術ブランディング・インテリジェンス</h1>
          </div>
          <div className="flex items-center gap-3 text-xs">
            <button onClick={() => exportJSON(terms)} className="text-stone-600 hover:text-stone-900 underline">エクスポート</button>
            <button onClick={() => fileInputRef.current?.click()} className="text-stone-600 hover:text-stone-900 underline">インポート</button>
            <input type="file" accept="application/json" ref={fileInputRef} onChange={handleImport} className="hidden" />
            <button onClick={() => setShowSettings(true)} className="text-stone-600 hover:text-stone-900 underline">設定</button>
          </div>
        </div>
      </header>
      <main className="max-w-6xl mx-auto px-6 py-10">
        {view === "portfolio" && (
          <PortfolioView terms={terms}
            onSelect={(id) => { setSelectedId(id); setView("detail"); }}
            onAddNew={() => setView("add")}
            onSeed={() => setView("seed")}
            onUpdateOrder={(reordered) => updateTerms(reordered)}
            onDelete={handleDelete} />
        )}
        {view === "detail" && selectedTerm && (
          <DetailView term={selectedTerm} allTags={allTags} useWebSearch={useWebSearch}
            onBack={() => setView("portfolio")} onUpdate={handleUpdate} onDelete={handleDelete} />
        )}
        {view === "add" && (
          <AddView onCancel={() => setView("portfolio")} onAdded={handleAdd}
            useWebSearch={useWebSearch} setUseWebSearch={setUseWebSearch} />
        )}
        {view === "seed" && (
          <SeedView existingTerms={terms} onCancel={() => setView("portfolio")} onTermAdded={handleTermAdded}
            useWebSearch={useWebSearch} setUseWebSearch={setUseWebSearch} />
        )}
      </main>
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
